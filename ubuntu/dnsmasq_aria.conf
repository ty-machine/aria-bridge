# dnsmasq snippet: redirect the Aria scale's traffic to your interceptor.
#
# Where to put this depends on your setup:
#   - Ubuntu box running its own dnsmasq (and your router hands out that
#     box's IP as the DNS server via DHCP): drop this in
#     /etc/dnsmasq.d/aria.conf and restart dnsmasq.
#   - A router that runs dnsmasq under the hood (many consumer routers,
#     OpenWrt, pfSense/OPNsense with unbound, etc.): find its custom DNS
#     override / "DNS host record" screen and add the same two mappings.
#
# Replace 192.168.1.50 with your Ubuntu box's actual LAN IP.

address=/www.fitbit.com/192.168.1.50
address=/1.scale.www.fitbit.com/192.168.1.50

# Optional but recommended: only intercept for the scale itself, so the
# rest of your network (your phone, laptop, etc.) still reaches the real
# fitbit.com if anything on it still needs to. Do this by scoping the
# override to the scale's IP/MAC via your router's per-device DNS or
# static lease + a dedicated VLAN, if your router supports it. Most
# consumer routers don't support this granularity, so a network-wide
# override for just these two Fitbit hostnames is the practical option —
# it doesn't affect any other Fitbit product, and nothing else on a normal
# home network talks to www.fitbit.com automatically.
